name: Manually build Tinkerer Proxy for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: apple-silicon
          - runner: macos-15-intel
            architecture: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check frontend and fork policy
        run: |
          bun run check
          cargo test --locked --manifest-path src-tauri/Cargo.toml fork_policy
      - name: Build locally signed app with pinned core
        run: bun run build:mac
      - name: Package app and record checksum
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/Tinkerer Proxy.app' 'artifacts/Tinkerer-Proxy-${{ matrix.architecture }}.zip'
          shasum -a 256 artifacts/*.zip > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tinkerer-Proxy-${{ matrix.architecture }}
          path: artifacts/
          if-no-files-found: error
